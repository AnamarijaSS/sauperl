<!DOCTYPE html>
<html lang="sl"><head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; width: 100%; }
#map { width: 100%; height: 100%; }
svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const HOME = new Set(['Slovenia']);
const EU_OTHER = new Set(['Austria','Belgium','Bulgaria','Croatia','Cyprus','Czechia','Czech Rep.','Denmark','Estonia','Finland','France','Germany','Greece','Hungary','Ireland','Italy','Latvia','Lithuania','Luxembourg','Malta','Netherlands','Poland','Portugal','Romania','Slovakia','Spain','Sweden']);
const UK_CH = new Set(['United Kingdom','Switzerland']);
const BALKAN = new Set(['Serbia','Bosnia and Herz.','Bosnia and Herzegovina','North Macedonia','Macedonia','Montenegro','Kosovo']);

function classify(name) {
if (HOME.has(name)) return 'home';
if (EU_OTHER.has(name) || UK_CH.has(name)) return 'eu';
if (BALKAN.has(name)) return 'balkan';
return 'other';
}

const COLORS = { home: '#1e8e4f', eu: '#8fc7a3', balkan: '#c9c3ba', other: '#e5ddd2' };

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
.then(r => r.json())
.then(topology => {
const countries = topojson.feature(topology, topology.objects.countries).features;
const highlighted = countries.filter(d => classify(d.properties.name) !== 'other');

const width = window.innerWidth || 1000;
const height = window.innerHeight || 420;
const bbox = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[[-10, 34], [-10, 71], [34, 71], [34, 34], [-10, 34]]] } };
const projection = d3.geoMercator();
projection.fitSize([width - 28, height - 28], bbox);
const path = d3.geoPath(projection);

const svg = d3.select('#map').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
svg.append('g').selectAll('path').data(highlighted).join('path')
.attr('d', path)
.attr('fill', d => COLORS[classify(d.properties.name)])
.attr('stroke', '#f5f1ec')
.attr('stroke-width', 0.75);
})
.catch(() => {
document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#8a8378;font-size:13px">Zemljevid trenutno ni na voljo</div>';
});
</script>

</body></html>
